# SFTP-only configuration. SFTP is SSH File Transfer Protocol (not FTPS).
# Listens on loopback by default; change sftp-i for LAN access.
# Password authentication is enabled for the configured copyparty accounts.
[global]
i: no
sftp-i: 127.0.0.1
sftp: 2222
sftp-pw

[/]
/home/ftpuser
accs:
  rw: zml
