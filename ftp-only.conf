# FTP-only configuration (plaintext FTP; use only on trusted networks).
# Control port is non-privileged so the script does not need sudo.
# For LAN access, change ftp-i to the server's LAN address or 0.0.0.0;
# open TCP 2121 and the passive TCP range below in the firewall.
[global]
i: no
ftp-i: 127.0.0.1
ftp: 2121
ftp-pr: 12000-12099

[/]
/home/ftpuser
accs:
  rw: zml
