# FTPS-only configuration (FTP over TLS).
# WARNING: This machine currently lacks the required PyOpenSSL dependency and
# a trusted TLS certificate. Install/configure both before running this service.
# Do not use the generated insecure fallback certificate for real credentials.
# For LAN access, change ftp-i and allow TCP 2121 plus the passive port range.
[global]
i: no
ftp-i: 127.0.0.1
ftps: 2121
ftp-pr: 12000-12099

[/]
/home/ftpuser
accs:
  rw: zml
