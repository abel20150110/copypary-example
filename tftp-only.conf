# TFTP-only configuration. TFTP has NO user/password authentication.
# Default loopback bind prevents LAN exposure until deliberately changed.
# To serve a LAN, change tftp-i and tftp-ipa to the trusted interface/subnet,
# and open UDP 6969 plus the UDP data range below in the firewall.
# The shared folder is exposed read-only to everyone via the '*' ACL.
[global]
i: no
tftp-i: 127.0.0.1
tftp: 6969
tftp-pr: 12000-12099
tftp-ipa: 127.0.0.1/32

[/]
/home/ftpuser
accs:
  r: *
