# SMB/CIFS-only configuration.
# DANGER: copyparty's bundled help warns this protocol is dangerous/buggy and
# must never be exposed to the internet. This config binds loopback only.
# SMB is read-only by default; do not enable smbw. Enabling SMB also requires
# --hack-me-bro, an explicit risk acceptance switch; script includes it.
# For LAN use, change smb-i to the trusted LAN address and keep firewall-scoped.
# Port 1445 is non-privileged; SMB clients may require port forwarding/mapping.
[global]
i: no
smb-i: 127.0.0.1
smb-port: 1445
smb

[/]
/home/ftpuser
accs:
  r: zml
